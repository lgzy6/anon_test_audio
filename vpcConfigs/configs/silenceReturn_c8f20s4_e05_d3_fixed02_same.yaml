# ═══════════════════════════════════════════════════════════════
# SilenceReturn + 固定 alpha=0.2  (bank: c8f20s4_e05_d3)
# 目的: 在 c8f20s4_e05_d3 离线池上验证 silenceReturn 检索方案下
#       alpha=0.2 (偏L24检索) 的效用影响
# 基线: silenceReturn_c8f16s4_fixed02_same (bank c8f16s4_e10_d3)
# 变量: bank c8f16s4_e10_d3 → c8f20s4_e05_d3
# ═══════════════════════════════════════════════════════════════
data_dir: data
results_dir: wav

pipeline: pseudo_target_top3_silenceNoise

anon_suffix: _silenceReturn_c8f20s4_e05_d3_fixed02_same_dur0.3

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: train-clean-360
    data: train-clean-360

modules:
  anon_suffix: !ref <anon_suffix>

  # ── 检索策略 ──
  mode: same
  top_k: 3
  alpha: 0.2
  use_adaptive_alpha: false

  # ── Bank 配置 ──
  bank_dir: banks_c8f20s4_e05_d3

  # ── Duration Predictor ──
  dur_weight: 0.3

  # ── 运行配置 ──
  batch_size: 16
