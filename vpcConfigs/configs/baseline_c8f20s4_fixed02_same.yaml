# ═══════════════════════════════════════════════════════════════
# 基线复现: alpha=0.2 固定 + c8f20s4 强Bank + 全局回退(无silenceReturn)
# 目的: 确认 EER≈49.66 的隐私SOTA基线是否稳定可复现
# Pipeline: pseudo_target_top3 (正常全局回退)
# ═══════════════════════════════════════════════════════════════
data_dir: data
results_dir: wav

pipeline: pseudo_target_top3

anon_suffix: _baseline_c8f20s4_fixed02_same_dur0.3

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: train-clean-360
    data: train-clean-360

modules:
  anon_suffix: !ref <anon_suffix>

  # ── 检索策略: 固定alpha=0.2 (偏L24检索, 强隐私) ──
  mode: same
  top_k: 3
  alpha: 0.2
  use_adaptive_alpha: false

  # ── Bank: c8f20s4 强Bank ──
  bank_dir: banks_c8f20s4_e05_d3

  # ── Duration Predictor ──
  dur_weight: 0.3

  # ── 运行配置 ──
  batch_size: 16
