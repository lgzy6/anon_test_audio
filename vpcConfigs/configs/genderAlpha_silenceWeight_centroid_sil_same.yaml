data_dir: data
results_dir: wav

pipeline: pseudo_target_top3_genderAlpha_silenceWeight

anon_suffix: _genderAlpha_silenceWeight_centroid_sil_same_dur0.3

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  # - name: train-clean-360
  #   data: train-clean-360

modules:
  anon_suffix: !ref <anon_suffix>

  mode: same
  top_k: 3
  
  use_gender_alpha: true
  alpha_m: 0.2
  alpha_f: 0.3
  
  silence_alpha: 0.8
  
  use_adaptive_alpha: false

  bank_dir: banks_c8f20s4_e05_d3_centroid_sil

  dur_weight: 0.3

  batch_size: 16
