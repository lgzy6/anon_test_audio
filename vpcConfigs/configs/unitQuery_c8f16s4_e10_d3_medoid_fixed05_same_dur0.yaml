# ═══════════════════════════════════════════════════════════════
# 实验 A: medoid + 无静音桶  (基线)
# 对比目的: A→B 隔离「静音建桶」贡献; B→C 隔离「帧池化」贡献
# ═══════════════════════════════════════════════════════════════
data_dir: data
results_dir: wav

pipeline: pseudo_target_top3

anon_suffix: _bankABC_A_medoid_nosil

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]

modules:
  anon_suffix: !ref <anon_suffix>
  mode: same
  top_k: 3
  alpha: 0.5
  use_adaptive_alpha: false
  bank_dir: banks_c8f16s4_e10_d3_medoid
  dur_weight: 0.0
  batch_size: 16