data_dir: data
results_dir: wav

pipeline: pseudo_target_top3
anon_suffix: _adaptive_alpha_prosody_c8f32s8_non_enropy_dur0

datasets:
  - name: IEMOCAP_devf
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]

modules:
  anon_suffix: !ref <anon_suffix>
  mode: same
  top_k: 3
  alpha: 0.2
  use_adaptive_alpha: true
  use_prosody_injection: false #test
  prosody_beta: 0.3
  dur_weight: 0
  batch_size: 16
