data_dir: data
results_dir: wav

pipeline: pseudo_target_top3_8pool

anon_suffix: _unitQuery_c8f20s4_centroid_sil_same_8pool_dur0_genderAlpha

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  # 取消注释以包含训练集(ASR微调等场景)
  # - name: train-clean-360
  #   data: train-clean-360

modules:
  anon_suffix: !ref <anon_suffix>

  mode: same
  top_k: 3
  alpha: 0.2
  use_adaptive_alpha: false
  use_gender_alpha: true
  alpha_m: 0.2
  alpha_f: 0.3

  bank_dir: banks_c8f20s4_e05_d3_centroid_sil
  n_pools: 8

  dur_weight: 0
  batch_size: 16
