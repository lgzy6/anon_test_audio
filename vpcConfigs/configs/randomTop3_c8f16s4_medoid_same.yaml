# ═══════════════════════════════════════════════════════════════
# 消融实验A: Medoid Bank vs Centroid Bank
# 目的: 验证 medoid(真实帧) 对 WER/UAR 的效用影响
# 基线: randomTop3_c8f16s4_e10_d3_fix_same (centroid bank)
# 变量: bank 从 centroid(c8f16s4) → medoid(c8f32s8)
# ═══════════════════════════════════════════════════════════════
data_dir: data
results_dir: wav

pipeline: pseudo_target_top3

anon_suffix: _randomTop3_c8f16s4_medoid_same_dur0.3

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]

modules:
  anon_suffix: !ref <anon_suffix>

  # ── 检索策略 (同基线) ──
  mode: same
  top_k: 3
  alpha: 1.0
  use_adaptive_alpha: true

  # ── Bank 配置: medoid 真实帧 ──
  bank_dir: banks_c8f16s4_e10_d3_medoid

  # ── Duration Predictor (同基线) ──
  dur_weight: 0.3

  # ── 运行配置 ──
  batch_size: 16
