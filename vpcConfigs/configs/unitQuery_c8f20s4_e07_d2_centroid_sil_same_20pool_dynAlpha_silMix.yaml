data_dir: data
results_dir: wav

pipeline: pseudo_target_top3_20pool_dynAlpha_silMix

anon_suffix: _unitQuery_c8f20s4_e07_d2_centroid_sil_same_20pool_dynAlpha_silMix

datasets:
  - name: IEMOCAP_dev
    data: IEMOCAP_dev
  - name: IEMOCAP_test
    data: IEMOCAP_test
  - name: libri_dev
    data: libri_dev
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: libri_test
    data: libri_test
    enrolls: [_enrolls]
    trials: [_trials_f, _trials_m]
  - name: train-clean-360
    data: train-clean-360

modules:
  anon_suffix: !ref <anon_suffix>
  mode: same
  top_k: 3

  alpha_low: 0.5
  alpha_high: 0.6

  # 静音帧: silence_noise_prob 概率走噪声回退，其余走 bank 检索
  silence_noise_prob: 0.5
  silence_noise_sigma: 0.3

  use_adaptive_alpha: false
  bank_dir: banks_c8f20s4_e07_d2_centroid_sil_20spk

  n_pools: 20
  dur_weight: 0.0
  batch_size: 16
